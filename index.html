  /* ===== DRONE: move diagrams (side view) ===== */
  const MOVES={rise:'Rise reveal',topdown:'Top-down rise',pullback:'Pull-back (Dronie)',track:'Follow',push:'Low push',hover:'Still hover',drift:'Slow drift',nofly:'No fly'};
  function moveSvg(m){
    const G='<line x1="0" y1="96" x2="320" y2="96" stroke="var(--mapline)" stroke-width="2"/>';
    const tree=(x,h)=>'<path d="M'+x+',96 l-9,0 l9,-'+h+' l9,'+h+' z" fill="var(--mapline)" opacity=".6"/>';
    const trees=[20,45,70,240,265,290].map((x,i)=>tree(x,18+(i%3)*6)).join('');
    const dr=(x,y,c)=>'<g fill="'+(c||'var(--drn)')+'"><rect x="'+(x-7)+'" y="'+(y-3)+'" width="14" height="6" rx="2"/><ellipse cx="'+(x-10)+'" cy="'+(y-5)+'" rx="6" ry="1.6"/><ellipse cx="'+(x+10)+'" cy="'+(y-5)+'" rx="6" ry="1.6"/></g>';
    const ar=(x1,y1,x2,y2,dash)=>'<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="var(--drn)" stroke-width="2.5" marker-end="url(#ah)"'+(dash?' stroke-dasharray="5 4"':'')+'/>';
    const T=(x,y,t,a)=>'<text x="'+x+'" y="'+y+'" font-size="10" fill="var(--mute)" font-family="Inter Tight,system-ui,sans-serif"'+(a?' text-anchor="'+a+'"':'')+'>'+t+'</text>';
    const per=(x)=>'<circle cx="'+x+'" cy="84" r="4" fill="var(--fg)"/><line x1="'+x+'" y1="88" x2="'+x+'" y2="96" stroke="var(--fg)" stroke-width="2"/>';
    const jeep=(x)=>'<rect x="'+x+'" y="86" width="26" height="10" rx="2" fill="var(--fg)"/>';
    const defs='<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--drn)"/></marker></defs>';
    let b='';
    if(m==='rise') b=trees+dr(160,80)+ar(160,72,160,22)+T(172,30,'up to ~100 m, tilt up')+T(172,84,'start just above the trees');
    else if(m==='topdown') b=trees+jeep(147)+dr(160,48)+'<line x1="160" y1="52" x2="160" y2="84" stroke="var(--drn)" stroke-dasharray="2 3"/>'+ar(150,44,150,10)+T(172,30,'camera straight down')+T(172,44,'rise: the jeep shrinks');
    else if(m==='pullback') b=trees+per(110)+dr(122,78)+ar(132,72,262,22)+T(190,70,'back and up, 30–40 s')+T(96,110,'Nina','middle');
    else if(m==='track') b=trees+jeep(150)+'<line x1="182" y1="91" x2="210" y2="91" stroke="var(--fg)" stroke-width="2" marker-end="url(#ah)"/>'+dr(110,40)+ar(124,40,230,40)+T(110,24,'behind and above, 40–60 m');
    else if(m==='push') b='<rect x="0" y="86" width="320" height="10" fill="var(--drn)" opacity=".25"/>'+dr(60,72)+ar(74,72,270,72)+T(60,58,'5–10 m over the water');
    else if(m==='hover') b=trees+dr(160,24)+T(175,28,'still, 60–80 m')+'<circle cx="120" cy="90" r="3" fill="var(--take)"/><circle cx="135" cy="90" r="3" fill="var(--take)"/>'+'<line x1="145" y1="90" x2="200" y2="90" stroke="var(--take)" stroke-width="2" marker-end="url(#ah)"/>'+T(120,110,'headlights move, the drone does not');
    else if(m==='drift') b=trees+'<rect x="0" y="66" width="320" height="22" fill="var(--mapline)" opacity=".35"/>'+T(312,80,'mist','end')+dr(60,50)+ar(74,50,220,50,true)+T(60,36,'very slow, no turns');
    else if(m==='nofly') b=dr(160,50,'var(--mute)')+'<line x1="140" y1="30" x2="180" y2="70" stroke="var(--bad)" stroke-width="4"/><line x1="180" y1="30" x2="140" y2="70" stroke="var(--bad)" stroke-width="4"/>'+T(160,92,'not here','middle');
    return '<svg viewBox="0 0 320 116" role="img" aria-label="Drone move: '+(MOVES[m]||'')+'">'+defs+G+b+'</svg>';

  const BMAP = Object.fromEntries(BLOCKS.map(b=>[b[0],{name:b[1],hint:b[2],day:b[3],cam:b[4],set:b[5]}]));
  const DNAME = Object.fromEntries(DAYS);

  let db=null, docs=[], view=(()=>{try{const v=localStorage.getItem('qb.day'); return DNAME[v]?v:'d1'}catch(e){return 'd1'}})();
  let hideDone=false, q='', sheetId=null, setupOpen=null;
  let pics=(()=>{try{return localStorage.getItem('qb.pics')==='1'}catch(e){return false}})();
  let mode=(()=>{try{const m=localStorage.getItem('qb.mode'); return m==='moments'||m==='drone'?m:'ask'}catch(e){return 'ask'}})();
  const inMode=d=>mode==='drone'?isDrn(d):mode==='moments'?isMom(d):(!isMom(d)&&!isDrn(d));
  const $=id=>document.getElementById(id);
  const status=(t)=>{$('status').textContent=t||''};
  const dayOf=d=>(BMAP[d.bucket]||{}).day||'m';

  function render(){
    const chips=$('chips'); chips.innerHTML='';
    for(const [k,name] of DAYS){
      const rows=docs.filter(d=>dayOf(d)===k&&inMode(d)); const done=rows.filter(d=>d.asked).length;
      const c=document.createElement('button'); c.className='chip'+(view===k?' on':'')+(rows.length&&done===rows.length?' full':'');
      c.innerHTML=esc(name)+' <span class="n">'+done+'/'+rows.length+'</span>';
      c.onclick=()=>setView(k); chips.appendChild(c);
    }
    const dayRows=docs.filter(d=>dayOf(d)===view&&inMode(d)), total=dayRows.length, asked=dayRows.filter(d=>d.asked).length;
    $('count').textContent=asked+' of '+total+(mode==='moments'?' moments caught':mode==='drone'?' drone shots done':' done today');
    $('mAsk').setAttribute('aria-selected',String(mode==='ask'));
    $('mMom').setAttribute('aria-selected',String(mode==='moments'));
    const dAll=docs.filter(d=>dayOf(d)===view);
    const a=dAll.filter(d=>!isMom(d)&&!isDrn(d)), mo=dAll.filter(d=>isMom(d)), dr=dAll.filter(d=>isDrn(d));
    $('nAsk').textContent=a.filter(d=>d.asked).length+'/'+a.length;
    $('nMom').textContent=mo.filter(d=>d.asked).length+'/'+mo.length;
    $('nDrn').textContent=dr.length?dr.filter(d=>d.asked).length+'/'+dr.length:'';
    $('mDrn').setAttribute('aria-selected',String(mode==='drone'));
    $('bar').style.width=(total?100*asked/total:0)+'%';

    const body=$('body'); body.innerHTML='';
    let any=false;
    if(mode==='moments' && !q){
      const r=document.createElement('div'); r.className='rules';
      r.innerHTML='<h3>How to catch a moment</h3><ol>'+
        '<li><b>Switch on purpose.</b> After every Q&amp;A with Nina: 5 minutes in this tab. Cameras stay up. You stop asking. You watch.</li>'+
        '<li><b>Never say cut.</b> Keep rolling 30 seconds after the last answer. People relax and say the true thing then.</li>'+
        '<li><b>Far and long.</b> Fuji at 300 mm, or a GO Ultra she forgets. Faces before things.</li>'+
        '<li><b>Ask her once, on day 1.</b> "The cameras will roll between questions. Say stop any time." She hates attention. Respect every stop.</li>'+
        '</ol>';
      body.appendChild(r);
    }
    if(mode==='drone' && !q){
      const r=document.createElement('div'); r.className='rules drn';
      r.innerHTML='<h3>How to fly, solo</h3><ol>'+
        '<li><b>Carry the permission on paper.</b> Your phone is in the gate locker on safari. Fly only where the permission covers.</li>'+
        '<li><b>Animals first.</b> Ask the guide before each launch. Never fly low over or toward an animal. If one reacts, climb and leave.</li>'+
        '<li><b>Never during a recording.</b> The buzz ruins the sound. Fly between the Q&amp;As.</li>'+
        '<li><b>One slow move per flight.</b> Cine mode. 5 seconds still at the start and the end. Two tries.</li>'+
        '<li><b>Batteries:</b> 20–25 real minutes each. Land at 30%. MUST shots first, while you have power.</li>'+
        '</ol>';
      body.appendChild(r);
    }
    for(const b of BLOCKS){
      if(b[3]!==view) continue;
      const k=b[0], meta=BMAP[k];
      let rows=docs.filter(d=>d.bucket===k&&inMode(d));
      if(!rows.length && !(mode==='moments'&&/-moments$/.test(k)) && !(mode==='drone'&&/-drone$/.test(k)) && !(mode==='ask'&&!/-moments$|-shots$|arrival$|-drone$/.test(k))) continue;
      if(mode!=='drone' && /-drone$/.test(k)) continue;
      if(mode==='drone' && !/-drone$/.test(k)) continue;
      if(hideDone) rows=rows.filter(d=>!d.asked);
      if(q) rows=rows.filter(d=>(d.text+' '+(d.hint||'')+' '+(d.who||'')+' '+(d.note||'')+' '+(d.lines||'')).toLowerCase().includes(q));
      if(q && !rows.length) continue;
      rows.sort((a,b)=>(a.order||0)-(b.order||0));
      any=true;
      const blk=document.createElement('div'); blk.className='block';
      blk.innerHTML='<div class="where">'+esc(meta.name)+'<small>'+esc(meta.hint)+'</small></div>'+
        (meta.cam!=='—'||meta.set!=='—' ? '<div class="gear">'+(meta.cam!=='—'?'<b>Cam</b><span>'+esc(meta.cam)+'</span>':'')+(meta.set!=='—'?'<b>Set</b><span>'+esc(meta.set)+'</span>':'')+'</div>' : '');
      const ss=BSET[k]||[];
      if(ss.length){
        const st=SETUPS[ss[0]];
        blk.insertAdjacentHTML('beforeend','<div class="setrow">'+ss.map(id=>'<button type="button" class="setbtn" data-setup="'+id+'"><span class="dots">'+SETUPS[id].cams.map(c=>'<i class="dot" style="background:var('+CAM[c.k][1]+')"></i>').join('')+'</span>Setup'+(ss.length>1?': '+esc(SETUPS[id].name):'')+' ›</button>').join('')+'</div>'+
          (pics&&st.hero?'<img class="setimg" src="'+st.hero+'" alt="Camera setup: '+esc(st.name)+'" loading="lazy" data-setup="'+ss[0]+'" tabindex="0">':''));
        blk.querySelectorAll('[data-setup]').forEach(b=>{b.onclick=()=>{setupOpen=b.dataset.setup;renderSheet()}});
      }
      body.appendChild(blk);
      const list=document.createElement('div'); list.className='list';
      for(const d of rows) list.appendChild(row(d));
      if(!rows.length){ const e=document.createElement('div'); e.className='empty'; e.textContent=hideDone?'All done here.':'Nothing here yet.'; list.appendChild(e); }
      body.appendChild(list);
      if(!q) body.appendChild(adder(k));
    }
    if(!any) body.innerHTML='<div class="empty">Nothing matches.</div>';
    renderSheet();
  }

  function labelOf(d){
    if(d.type==='drone') return d.rank==='must'?['Drone · MUST · '+(MOVES[d.move]||''),'must']:d.rank==='no'?['No fly','grey']:['Drone · '+(MOVES[d.move]||''),'drn'];
    if(d.type==='ptc') return ['A-Roll','take'];
    if(d.type==='shot') return ['Shot','grey'];
    if(d.type==='moment') return ['Moment',''];
    if(d.type==='task') return ['Do','grey'];
    if(/^take/i.test(d.who||'')) return [d.who,'take'];
    const w=d.who||'';
    if(w && !/^(Verbatim|Object|Line|Saurabh|You say|Shot|Do|Moment)$/i.test(w) && !/^Q&A/.test(w)) return ['Q&A with '+w,''];
    return [w, ''];
  }

  function row(d){
    const el=document.createElement('div'); el.className='q'+(d.asked?' done':'')+(d.type==='ptc'?' ptc':'')+(d.type==='moment'?' moment':'')+(d.type==='drone'?' drone':''); el.dataset.id=d.id;
    const [lab,cls]=labelOf(d);
    el.innerHTML =
      '<div class="box" role="checkbox" tabindex="0" aria-checked="'+(!!d.asked)+'">'+(d.asked?'✓':'')+'</div>'+
      '<div class="t">'+(lab?'<div class="who '+cls+'">'+esc(lab)+'</div>':'')+
        '<div>'+esc(d.text)+'</div>'+(d.hint?'<div class="h">'+esc(d.hint)+'</div>':'')+(d.note?'<div class="note">'+esc(d.note)+'</div>':'')+'</div>'+
      '<div class="arrow" aria-hidden="true">›</div>';
    el.querySelector('.box').onclick=()=>toggle(d);
    el.querySelector('.box').onkeydown=e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();toggle(d)}};
    el.querySelector('.t').onclick=()=>{sheetId=d.id;renderSheet()};
    el.querySelector('.arrow').onclick=()=>{sheetId=d.id;renderSheet()};
    return el;
  }

  function renderSheet(){
    const root=$('sheetRoot'); root.innerHTML='';
    if(setupOpen){ renderSetup(root); return; }
    if(!sheetId) { document.body.style.overflow=''; return; }
    const d=docs.find(x=>x.id===sheetId); if(!d){ sheetId=null; return; }
    const meta=BMAP[d.bucket]||{name:d.bucket,hint:'',cam:'—',set:'—'};
    const [lab,cls]=labelOf(d);
    const cam=d.camera||meta.cam, set=d.settings||meta.set;
    let h='<div class="veil"></div><div class="sheet" role="dialog" aria-modal="true">'+
      '<div class="top"><div><span class="bk">'+esc(meta.name)+'</span>'+(lab?'<div class="lbl" style="color:var(--'+(cls==='take'?'take':cls==='grey'?'mute':'accent')+')">'+esc(lab)+'</div>':'')+'</div><button class="x" aria-label="Close">×</button></div>';
    if(d.type==='ptc'){
      h+='<div class="big">'+esc(d.text)+'</div>';
      if(d.before) h+='<div class="before"><span class="lbl">Before this, the viewer hears</span>'+esc(d.before)+'</div>';
      if(d.runin) h+='<div class="runin"><span class="lbl" style="font-family:var(--display);color:var(--mute)">Say this first, then roll</span>'+esc(d.runin)+'</div>';
      if(d.lines) h+='<div class="say"><span class="lbl">Say this to camera</span>'+esc(d.lines)+'</div>';
      if(d.next) h+='<div class="next"><span class="lbl">Next cut</span>'+esc(d.next)+'</div>';
    } else if(d.type==='drone'){
      h+='<div class="big">'+esc(d.text)+'</div>';
      if(d.hint) h+='<div class="hint">'+esc(d.hint)+'</div>';
      h+='<span class="lbl" style="margin-top:10px">The move · '+esc(MOVES[d.move]||'')+'</span><div class="mv">'+moveSvg(d.move)+'</div>';
      if(d.lines) h+='<ol class="steps">'+d.lines.split('\n').map(x=>'<li>'+esc(x)+'</li>').join('')+'</ol>';
    } else {
      h+='<div class="big">'+esc(d.text)+'</div>';
      if(d.hint) h+='<div class="hint">'+esc(d.hint)+'</div>';
      if(d.lines) h+='<div class="say">'+esc(d.lines)+'</div>';
    }
    h+='<div class="hud"><span class="lbl">Camera</span>'+esc(cam)+'<br><span class="lbl" style="margin-top:8px">Settings</span>'+esc(set)+'</div>';
    if(d.flag) h+='<div class="flag">'+esc(d.flag)+'</div>';
    const rs=BSET[d.bucket]||[];
    if(rs.length) h+='<div class="row">'+rs.map(id=>'<button class="btn ghost" data-setup="'+id+'">See setup'+(rs.length>1?': '+esc(SETUPS[id].name):'')+' ›</button>').join('')+'</div>';
    h+='<div class="row"><button class="btn'+(d.asked?' done':'')+'" data-act="tick">'+(d.asked?'✓ Done':(d.type==='moment'?'Caught it':d.type==='drone'?'Got it':'Mark done'))+'</button><button class="btn ghost" data-act="close">Close</button></div>';
    h+='<div class="edit"><label>Note<textarea id="sh-note" placeholder="What she said, what to follow up, what went wrong…">'+esc(d.note||'')+'</textarea></label>'+
       '<label>Move to<select id="sh-mv">'+BLOCKS.map(b=>'<option value="'+b[0]+'"'+(b[0]===d.bucket?' selected':'')+'>'+esc(DNAME[b[3]]+' — '+b[1])+'</option>').join('')+'</select></label>'+
       '<div class="row"><button class="btn" data-act="save">Save</button><button class="btn danger" data-act="del">Remove</button></div></div>';
    h+='</div>';
    root.innerHTML=h;
    document.body.style.overflow='hidden';
    const close=()=>{sheetId=null;renderSheet()};
    root.querySelector('.veil').onclick=close;
    root.querySelector('.x').onclick=close;
    root.querySelector('[data-act=close]').onclick=close;
    root.querySelector('[data-act=tick]').onclick=()=>toggle(d);
    root.querySelectorAll('[data-setup]').forEach(b=>{b.onclick=()=>{setupOpen=b.dataset.setup;renderSheet()}});
    root.querySelector('[data-act=save]').onclick=async()=>{
      const bucket=$('sh-mv').value, note=$('sh-note').value.trim();
      if(bucket!==d.bucket||note!==(d.note||'')) await write(d.id,{bucket,note});
      close();
    };
    root.querySelector('[data-act=del]').onclick=async()=>{
      const b=root.querySelector('[data-act=del]'); if(b.dataset.armed!=='1'){b.dataset.armed='1';b.textContent='Tap again to remove';return}
      if(db){ try{ await db.doc('questions/'+d.id).delete(); status('Removed.'); }catch(e){ status('Could not remove.'); } }
      docs=docs.filter(x=>x.id!==d.id); close(); render();
    };
  }

  function renderSetup(root){
    const st=SETUPS[setupOpen]; if(!st){ setupOpen=null; renderSheet(); return; }
    const cams=st.cams.map(c=>'<div class="cam" style="--c:var('+CAM[c.k][1]+')"><div class="hd"><span class="nm">'+CAM[c.k][0]+'</span><span class="mt">'+esc(c.mount)+'</span></div><div class="what">'+esc(c.what)+'</div>'+(c.img?'<img src="'+c.img+'" alt="What the '+CAM[c.k][0]+' sees" loading="lazy">':'')+'<div class="set">'+c.set+'</div></div>').join('');
    root.innerHTML='<div class="veil"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="'+esc(st.name)+'">'+
      '<div class="top"><div><span class="bk">Camera setup</span><div class="big" style="margin:2px 0 0">'+esc(st.name)+'</div></div><button class="x" aria-label="Close">×</button></div>'+
      (st.hero?'<img class="hero" src="'+st.hero+'" alt="Behind-the-scenes reference"><p class="cap">'+esc(st.cap)+' The people are stand-ins.</p>':'')+
      '<span class="lbl" style="margin-top:14px">From above</span><div class="map">'+st.map+'</div>'+
      '<p class="cap">S = you · N = Nina · D, G = driver, guide. Each coloured fan is what that camera sees. Dashed = later.</p>'+
      '<span class="lbl" style="margin-top:14px">Cameras · how each one hangs</span>'+cams+
      '<div class="alt">'+esc(st.alt)+'</div><div class="warn">'+esc(st.warn)+'</div>'+
      '<p class="solo">Solo rule: one tripod, only where you sit or stand still. Every other camera is in your hand, clipped to the bag, on a magnet, or standing on the bag.</p>'+
      '<div class="row"><button class="btn ghost" data-act="close">'+(sheetId?'‹ Back':'Close')+'</button></div></div>';
    document.body.style.overflow='hidden';
    const close=()=>{setupOpen=null;renderSheet()};
    root.querySelector('.veil').onclick=close; root.querySelector('.x').onclick=close; root.querySelector('[data-act=close]').onclick=close;
  }

  function adder(bucket){
    const f=document.createElement('form'); f.className='add';
    f.innerHTML='<input id="add-'+bucket+'" placeholder="'+(mode==='moments'?'Add a moment to watch for…':mode==='drone'?'Add a drone shot…':'Add a line here…')+'" aria-label="Add a line"><button class="btn" type="submit">Add</button>';
    f.onsubmit=async e=>{
      e.preventDefault(); const inp=f.querySelector('input'); const text=inp.value.trim(); if(!text) return;
      const order=Math.max(0,...docs.filter(d=>d.bucket===bucket).map(d=>d.order||0))+1;
      const id='u'+Date.now().toString(36);
      const body=mode==='drone'?{text,bucket,order,who:'Drone',type:'drone',rank:'nice',move:'',asked:false,note:'',hint:'',source:'added on phone'}:mode==='moments'?{text,bucket,order,who:'Moment',type:'moment',asked:false,note:'',hint:'',source:'added on phone'}:{text,bucket,order,who:'Saurabh',type:'q',asked:false,note:'',hint:'',source:'added on phone'};
      docs.push(Object.assign({id},body)); inp.value=''; render();
      if(db){ try{ await db.doc('questions/'+id).set(body); status('Added.'); }catch(err){ status('Saved on this phone only. Not synced.'); } }
    };
    return f;
  }

  async function toggle(d){
    const asked=!d.asked;
    await write(d.id,{asked, asked_at: asked? new Date().toISOString() : ''});
  }
  async function write(id,patch){
    const d=docs.find(x=>x.id===id); if(!d) return;
    Object.assign(d,patch); render();
    if(!db){ status('Not synced.'); return; }
    try{ await db.doc('questions/'+id).update(patch); status(''); }
    catch(e){ if(e&&e.code==='invalid_argument'){ status('Read-only for you.'); } else status('Could not save. Try again.'); }
  }
  function setView(k){ view=k; sheetId=null; setupOpen=null; try{localStorage.setItem('qb.day',k)}catch(e){} render(); window.scrollTo({top:0}); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

  function setMode(m){ mode=m; sheetId=null; setupOpen=null; try{localStorage.setItem('qb.mode',m)}catch(e){} render(); window.scrollTo({top:0}); }
  $('mAsk').onclick=()=>setMode('ask');
  $('mMom').onclick=()=>setMode('moments');
  $('mDrn').onclick=()=>setMode('drone');
  $('search').oninput=e=>{q=e.target.value.trim().toLowerCase();render()};
  $('hideDone').onchange=e=>{hideDone=e.target.checked;render()};
  $('pics').checked=pics;
  $('pics').onchange=e=>{pics=e.target.checked;try{localStorage.setItem('qb.pics',pics?'1':'0')}catch(_){}render()};
  document.addEventListener('keydown',e=>{if(e.key!=='Escape')return; if(setupOpen){setupOpen=null;renderSheet()} else if(sheetId){sheetId=null;renderSheet()}});
  render();

  (async()=>{
    db = await window.SB.db();
    if(!db){ $('body').innerHTML='<div class="empty">The store did not open. Reload the page.</div>'; return; }
    db.collection('questions').onSnapshot(snap=>{
      docs = snap.docs.filter(s=>s.exists).map(s=>Object.assign({id:s.id}, s.data()));
      render();
    }, err=>{ status('Live sync stopped. Reload the page.'); });
  })();
})();
</script>

</body></html>
